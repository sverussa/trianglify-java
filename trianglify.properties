#
# Trianglify — parametros de geracao
#
# Todas as chaves abaixo podem ser sobrescritas na linha de comando:
#   ./run.sh --seed=outra --width=1920
#

# ---------------------------------------------------------------------------
# Geometria
# ---------------------------------------------------------------------------

# Dimensoes da imagem, em pixels.
width  = 800
height = 600

# Tamanho da celula da grade. Valores menores geram mais triangulos (e mais
# detalhe); valores maiores geram um mosaico mais grosseiro.
cellSize = 75

# Deslocamento aleatorio aplicado a cada ponto, como fracao de cellSize.
#   0.0 = grade perfeitamente regular
#   1.0 = pontos podem se deslocar meia celula para qualquer lado
variance = 0.75

# Semente do gerador pseudo-aleatorio. A mesma semente sempre produz o mesmo
# padrao. Deixe em branco para sortear uma semente a cada execucao.
seed = zyn

# Pontos explicitos, no formato "x1,y1; x2,y2; ...". Quando preenchido,
# substitui a grade com jitter e ignora cellSize/variance.
# points =

# ---------------------------------------------------------------------------
# Cores
# ---------------------------------------------------------------------------

# Gradiente do eixo X. Aceita:
#   - nome de paleta ColorBrewer: YlGn, YlGnBu, GnBu, BuGn, PuBuGn, PuBu, BuPu,
#     RdPu, PuRd, OrRd, YlOrRd, YlOrBr, Purples, Blues, Greens, Oranges, Reds,
#     Greys, PuOr, BrBG, PRGn, PiYG, RdBu, RdGy, RdYlBu, Spectral, RdYlGn
#   - "random": sorteia uma paleta usando a semente
#   - lista de cores hexadecimais separadas por virgula: #001f3f,#0074d9,#7fdbff
xColors = YlGnBu

# Gradiente do eixo Y. Use "match" para reaproveitar o gradiente do eixo X.
yColors = match

# Espaco de cor da interpolacao: "lab" (perceptualmente uniforme) ou "rgb".
colorSpace = lab

# Estrategia de coloracao de cada triangulo:
#   interpolateLinear - mistura os gradientes X e Y (padrao)
#   sparkle           - adiciona ruido aos gradientes, aumentando o contraste
#   shadows           - escurece cada celula aleatoriamente, simulando sombras
colorFunction = interpolateLinear

# Parametro da funcao de cor. O significado depende da funcao escolhida:
#   interpolateLinear -> peso do eixo Y sobre o X   (padrao 0.5)
#   sparkle           -> intensidade do ruido        (padrao 0.15)
#   shadows           -> intensidade da sombra       (padrao 0.8)
colorFunction.arg = 0.5

# ---------------------------------------------------------------------------
# Traco
# ---------------------------------------------------------------------------

# Preencher os triangulos.
fill = true

# Espessura do contorno de cada triangulo. 0 desliga o contorno.
# Combine fill=false com strokeWidth>0 para obter um efeito de wireframe.
strokeWidth = 0

# ---------------------------------------------------------------------------
# Saida
# ---------------------------------------------------------------------------

# Caminho do arquivo gerado. A extensao e ajustada conforme output.format.
output.file = saida/trianglify.png

# png | svg | both
output.format = both

# Fator de supersampling do PNG (2 = imagem com o dobro de pixels, para telas
# de alta densidade). Nao afeta o SVG, que e vetorial.
output.scale = 1

# ---------------------------------------------------------------------------
# SVG
# ---------------------------------------------------------------------------

# Casas decimais das coordenadas no SVG. Menos casas = arquivo menor.
# Use -1 para desativar o arredondamento.
svg.coordinateDecimals = 1

# Incluir xmlns no elemento <svg> (necessario para abrir o arquivo isolado).
svg.includeNamespace = true

# ---------------------------------------------------------------------------
# Animacao   (usadas por ./animar.sh, ou seja, com --animar)
#
# A animacao passeia por varias sementes. Como a grade de pontos tem sempre o
# mesmo numero de linhas e colunas, o ponto i de uma semente e o ponto i da
# seguinte sao o mesmo ponto da grade em lugares diferentes: interpolar entre os
# dois faz a malha se mover, e a triangulacao e refeita a cada quadro.
# ---------------------------------------------------------------------------

# Sementes visitadas, separadas por virgula. Em branco, sao derivadas de "seed"
# (a primeira e a propria seed, as demais ganham um sufixo ~1, ~2, ...), de modo
# que a animacao inteira continua reproduzivel a partir de uma semente so.
# anim.seeds = praia, montanha, cidade

# Quantas sementes derivar quando anim.seeds esta em branco.
anim.seedCount = 6

# Duracao de uma transicao de uma semente para a proxima, em segundos.
anim.transition = 2.5

# Pausa sobre cada semente, entre uma transicao e a proxima, em segundos.
anim.hold = 0.8

# Multiplicador de velocidade: divide a transicao e a pausa. 2 = o dobro da
# velocidade, 0.5 = metade. Serve para acelerar tudo sem mexer nos dois valores.
anim.speed = 1

# Duracao do arquivo exportado, em segundos. Maximo: 120.
# Para o GIF emendar o fim no comeco sem solavanco, use um multiplo da volta
# completa (= seedCount x (transition + hold) / speed). O --animar informa qual.
anim.duration = 12

# Quadros por segundo. O GIF conta o tempo em centesimos de segundo, entao
# valores como 25 ou 20 caem exatos; 30 vira 33,3 na pratica.
anim.fps = 30

# Escala aplicada a largura/altura so no arquivo animado. Use 0.5 para um GIF
# mais leve sem mexer nas dimensoes da imagem parada.
anim.scale = 1

# gif | mp4
anim.format = gif

# Caminho do arquivo animado. A extensao e ajustada conforme anim.format.
anim.file = saida/trianglify-anim.gif

# Quem codifica:
#   auto   - ffmpeg se estiver instalado, senao o codificador do JDK
#   ffmpeg - exige o ffmpeg (obrigatorio para mp4; no gif, aplica dithering)
#   java   - so o JDK, sem depender de nada instalado (gif apenas)
anim.encoder = auto
